name: Java CI with Maven

on:
  push:
    branches: main

jobs:
  build:
    runs-on: ubuntu-latest

    # The @SpringBootTest context test needs a real MySQL database
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: employedemo
          MYSQL_USER: employe
          MYSQL_PASSWORD: employe
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Vérification du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for a better SonarCloud analysis

      # The SonarCloud scanner requires Java 21 (the app itself still targets Java 17)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test
        run: mvn clean verify sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }}
